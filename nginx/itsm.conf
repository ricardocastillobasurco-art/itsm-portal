# nginx/itsm.conf — Reverse proxy para ITSM SaaS
# Reemplaza APP_DOMAIN con tu dominio real (e.g. app.tudominio.com)
#
# Instalación:
#   sudo cp nginx/itsm.conf /etc/nginx/sites-available/itsm
#   sudo ln -s /etc/nginx/sites-available/itsm /etc/nginx/sites-enabled/itsm
#   sudo certbot --nginx -d APP_DOMAIN -d *.APP_DOMAIN
#   sudo nginx -t && sudo systemctl reload nginx

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# ── HTTP → HTTPS redirect ─────────────────────────────────────────────────────
server {
    listen 80;
    listen [::]:80;
    server_name APP_DOMAIN *.APP_DOMAIN;
    return 301 https://$host$request_uri;
}

# ── HTTPS main block ──────────────────────────────────────────────────────────
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name APP_DOMAIN *.APP_DOMAIN;

    ssl_certificate     /etc/letsencrypt/live/APP_DOMAIN/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/APP_DOMAIN/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    # Security headers
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Frame-Options           DENY                                            always;
    add_header X-Content-Type-Options    nosniff                                         always;
    add_header Referrer-Policy           "strict-origin-when-cross-origin"               always;
    add_header Permissions-Policy        "geolocation=(), microphone=()"                 always;

    # Upload limit (ticket attachments)
    client_max_body_size 25M;

    # Extract subdomain slug for tenant resolution
    # e.g. acme.app.tudominio.com → slug = acme
    set $tenant_slug "";
    if ($host ~* ^([^.]+)\.APP_DOMAIN$) {
        set $tenant_slug $1;
    }

    # ── Proxy to Node app ──────────────────────────────────────────────────
    location / {
        proxy_pass         http://127.0.0.1:3000;
        proxy_http_version 1.1;

        proxy_set_header   Host              $host;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   X-Real-IP         $remote_addr;

        # Pass tenant slug — tenantMiddleware reads this to skip subdomain lookup
        proxy_set_header   X-Tenant-Slug     $tenant_slug;

        # WebSocket support (Socket.io)
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        $connection_upgrade;

        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    # ── Static assets — served directly by nginx ───────────────────────────
    location /public/ {
        alias   /srv/itsm/public/;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # ── Block direct access to metrics (internal only) ─────────────────────
    location = /metrics {
        allow 127.0.0.1;
        deny  all;
        proxy_pass http://127.0.0.1:3000/metrics;
    }

    # ── Grafana (proxied from internal port 3001) ──────────────────────────
    location /grafana/ {
        proxy_pass         http://127.0.0.1:3001/;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }
}
