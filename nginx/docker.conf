# nginx/docker.conf — Configuración para uso DENTRO de Docker
#
# Diferencia con itsm.conf (instalación nativa):
#   - proxy_pass apunta a "app:3000" (nombre del servicio en la red Docker)
#   - No hay TLS aquí — el certificado SSL lo maneja el servidor/firewall externo
#     o se agrega un contenedor certbot aparte si se tiene dominio
#
# Este archivo es montado por el contenedor nginx en docker-compose.windows.yml

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name _;

    client_max_body_size 25M;

    # Compresión gzip para respuestas de texto
    gzip            on;
    gzip_types      text/plain text/css application/json application/javascript text/xml application/xml;
    gzip_min_length 1000;

    # ── Proxy hacia la app Node.js ────────────────────────────────────────────
    # "app" es el nombre del servicio definido en docker-compose
    # Docker resuelve ese nombre como IP interna automáticamente
    location / {
        proxy_pass         http://app:3000;
        proxy_http_version 1.1;

        proxy_set_header   Host              $host;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   X-Real-IP         $remote_addr;

        # WebSocket (Socket.io en tiempo real)
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        $connection_upgrade;

        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    # ── Métricas — solo accesibles desde dentro de la red Docker ─────────────
    # Prometheus puede scrapearlo internamente; el exterior no llega aquí
    location = /metrics {
        allow  172.16.0.0/12;   # rango de redes internas Docker
        deny   all;
        proxy_pass http://app:3000/metrics;
    }
}
