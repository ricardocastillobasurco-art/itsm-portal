name: Backup diario de la base de datos

# Copia diaria de la BD de producción, cifrada (AES-256) y guardada 30 días como
# artefacto privado del repositorio. Restaurar: docs/RESPALDOS.md
#
# Secretos necesarios (GitHub → Settings → Secrets and variables → Actions):
#   BACKUP_DB_HOST, BACKUP_DB_PORT, BACKUP_DB_USER, BACKUP_DB_PASSWORD, BACKUP_DB_NAME
#   BACKUP_PASSPHRASE  ← contraseña para cifrar; guárdala también fuera de GitHub
on:
  schedule:
    - cron: '0 8 * * *'        # 03:00 hora de Lima
  workflow_dispatch:

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DB_HOST: ${{ secrets.BACKUP_DB_HOST }}
      DB_PORT: ${{ secrets.BACKUP_DB_PORT }}
      DB_USER: ${{ secrets.BACKUP_DB_USER }}
      DB_PASSWORD: ${{ secrets.BACKUP_DB_PASSWORD }}
      DB_NAME: ${{ secrets.BACKUP_DB_NAME }}
      PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
    steps:
      - name: ¿Está configurado?
        id: cfg
        run: |
          if [ -z "$DB_HOST" ] || [ -z "$DB_NAME" ] || [ -z "$PASSPHRASE" ]; then
            echo "::warning::Backup no configurado: faltan secretos BACKUP_* (ver docs/RESPALDOS.md)"
            echo "ok=false" >> "$GITHUB_OUTPUT"
          else
            echo "ok=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Copia de la base (consistente, sin bloquear la app)
        if: steps.cfg.outputs.ok == 'true'
        run: |
          set -euo pipefail
          STAMP=$(date -u +%Y%m%d-%H%M)
          echo "STAMP=$STAMP" >> "$GITHUB_ENV"
          export MYSQL_PWD="$DB_PASSWORD"
          mysqldump -h "$DB_HOST" -P "${DB_PORT:-3306}" -u "$DB_USER" \
            --single-transaction --quick --routines --triggers --events \
            --no-tablespaces --set-gtid-purged=OFF --default-character-set=utf8mb4 \
            "$DB_NAME" | gzip -9 > "itsm-$STAMP.sql.gz"
          # Una copia vacía o truncada no sirve: se valida antes de guardar
          SIZE=$(stat -c %s "itsm-$STAMP.sql.gz")
          zcat "itsm-$STAMP.sql.gz" | tail -n 1 | grep -q "Dump completed" || { echo "::error::Copia incompleta"; exit 1; }
          [ "$SIZE" -gt 10240 ] || { echo "::error::Copia demasiado pequeña ($SIZE bytes)"; exit 1; }
          echo "Copia: $SIZE bytes"

      - name: Cifrar
        if: steps.cfg.outputs.ok == 'true'
        run: |
          set -euo pipefail
          gpg --batch --yes --pinentry-mode loopback --passphrase "$PASSPHRASE" \
              --symmetric --cipher-algo AES256 -o "itsm-$STAMP.sql.gz.gpg" "itsm-$STAMP.sql.gz"
          shred -u "itsm-$STAMP.sql.gz"

      - uses: actions/upload-artifact@v4
        if: steps.cfg.outputs.ok == 'true'
        with:
          name: backup-${{ env.STAMP }}
          path: itsm-${{ env.STAMP }}.sql.gz.gpg
          retention-days: 30
          if-no-files-found: error
